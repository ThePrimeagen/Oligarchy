name: migrations

on:
  pull_request:

jobs:
  append-only:
    name: migrations are append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fail if an existing migration file was edited, deleted, or renamed
        run: |
          # Without rename detection a file that arrived under this path is an addition, so
          # moving the folder here did not trip the check; a later rename shows as a deletion.
          violations=$(git diff --no-renames --name-status --diff-filter=MDT \
            "origin/${{ github.base_ref }}...HEAD" \
            -- 'packages/db/drizzle/' ':(exclude)packages/db/drizzle/meta/_journal.json')
          if [ -n "$violations" ]; then
            echo "Migrations are append-only. These files were edited, deleted, or renamed:"
            echo "$violations"
            echo "Revert them and add a new migration instead (bun run db:generate)."
            exit 1
          fi

  schema-in-sync:
    name: migrations match the drizzle schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db db:check
      - name: fail if drizzle-kit generate produces changes
        run: |
          bun run db:generate
          drift=$(git status --porcelain packages/db/drizzle/)
          if [ -n "$drift" ]; then
            echo "packages/db/src/schema.ts does not match the committed migrations:"
            echo "$drift"
            echo "Run 'bun run db:generate' and commit the result."
            exit 1
          fi

  checks:
    name: lint, format, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:fast
